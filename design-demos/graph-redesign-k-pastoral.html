<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图谱观赏 K · 田园风车 Pastoral Fields — obsidian-rag</title>
<style>
/* K · 田园风车：单文件离线 / 系统字体 / 实底浮层 / 单画布 */
*{margin:0;padding:0;box-sizing:border-box}
:root{--font-ui:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;--font-mono:Consolas,"Courier New",monospace}
[data-theme="light"]{
  --canvas:#8FC3EC;--float:#FFFFFF;--float2:#EFF6E4;--ink:#23301C;--body:#3C4A33;--sec:#6B7A60;--ph:#9AA48C;
  --hair:rgba(35,48,28,.14);--hair2:rgba(35,48,28,.28);
  --accent:#B45309;--accent-dim:rgba(180,83,9,.10);
  --c0:#16A34A;--c1:#1D6FD1;--c2:#B45309;--c3:#DB2777;
  --fail:#DC2626;--pend:#8A8F85;--sky1:#6FAEE6;--sky2:#CFE8C8;--sun:#FFF3C4;
}
[data-theme="dark"]{
  --canvas:#2C3A5E;--float:#232B45;--float2:#2C3554;--ink:#F5EFE0;--body:#CFC6AE;--sec:#96907C;--ph:#6B6656;
  --hair:rgba(255,255,255,.12);--hair2:rgba(255,255,255,.24);
  --accent:#FFD166;--accent-dim:rgba(255,209,102,.12);
  --c0:#4ADE80;--c1:#7DB8FF;--c2:#FBBF24;--c3:#F472B6;
  --fail:#F87171;--pend:#9AA39A;--sky1:#2C3A5E;--sky2:#E88B5A;--sun:#FFD9A0;
}
html,body{height:100%}
body{background:var(--canvas);color:var(--body);font-family:var(--font-ui);font-size:14px;overflow:hidden}
.top{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--float);border-bottom:1px solid var(--hair)}
.brand{color:var(--ink);font-weight:700;font-size:14px;white-space:nowrap}
.brand small{color:var(--sec);font-weight:400;font-size:11px;margin-left:8px}
.tag{font-family:var(--font-mono);font-size:10.5px;color:var(--sec);border:1px solid var(--hair);border-radius:99px;padding:2px 10px;white-space:nowrap}
.seg{display:flex;gap:4px;background:var(--float2);border:1px solid var(--hair);border-radius:10px;padding:3px}
.seg button{font-size:12px;color:var(--sec);border:0;border-radius:7px;padding:4px 12px;background:transparent;cursor:pointer}
.seg button.on{color:var(--ink);background:var(--accent-dim);box-shadow:inset 0 0 0 1px var(--accent)}
.libs{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--body);border:1px solid var(--hair);border-radius:99px;padding:4px 11px 4px 8px;background:transparent;cursor:pointer}
.chip i{width:10px;height:10px;border-radius:3px;display:inline-block}
.chip small{font-family:var(--font-mono);color:var(--sec);font-size:10.5px}
.chip.off{opacity:.38}
.chip.off i{background:transparent !important;box-shadow:inset 0 0 0 1px var(--sec)}
.spacer{flex:1}
.search{display:flex;align-items:center;gap:6px}
.search input{width:172px;font-size:12px;color:var(--ink);background:var(--float2);border:1px solid var(--hair);border-radius:9px;padding:6px 10px;outline:none;font-family:var(--font-ui)}
.search input::placeholder{color:var(--ph)}
.search input:focus{border-color:var(--accent)}
.hits{font-family:var(--font-mono);font-size:11px;color:var(--accent);min-width:64px}
.theme-btn{font-size:12px;color:var(--sec);border:1px solid var(--hair);border-radius:9px;padding:6px 12px;background:transparent;cursor:pointer}
.theme-btn:hover{color:var(--ink);border-color:var(--hair2)}
#cv{position:fixed;inset:0;display:block;cursor:grab}
#cv.drag{cursor:grabbing}
.legend{position:fixed;right:14px;top:64px;z-index:20;background:var(--float);border:1px solid var(--hair);border-radius:12px;padding:10px 12px;font-size:11.5px;color:var(--sec);line-height:1.9;max-width:220px}
.legend b{color:var(--ink);font-size:12px}
.status{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;align-items:center;gap:14px;padding:8px 16px;background:var(--float);border-top:1px solid var(--hair);font-family:var(--font-mono);font-size:11.5px;color:var(--sec)}
.status .ok{color:var(--accent)}
#tip{position:fixed;z-index:50;display:none;max-width:280px;background:var(--float);border:1px solid var(--hair2);border-radius:10px;padding:9px 12px;font-size:12px;color:var(--body);line-height:1.7;pointer-events:none}
#tip b{color:var(--ink);font-size:13px}
#tip .m{font-family:var(--font-mono);font-size:11px;color:var(--sec)}
#tip .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
</style>
</head>
<body>
<div class="top">
  <div class="brand">K · 田园风车<small>观赏型 demo · 致敬吉卜力式田园，一屋即一篇</small></div>
  <span class="tag">500 笔记 · 单画布</span>
  <div class="seg" id="dens"><button data-n="50">50</button><button data-n="150">150</button><button data-n="500" class="on">500</button></div>
  <div class="libs" id="libs"></div>
  <div class="spacer"></div>
  <div class="search"><input id="q" type="text" placeholder="⌕ 弱搜索 · 标题/主题" autocomplete="off"><span class="hits" id="hits"></span></div>
  <button class="theme-btn" id="theme">暮色</button>
</div>
<canvas id="cv"></canvas>
<div class="legend"><b>图例 · 地貌即分界</b><br>
▤ 技术梯田 · 田埂实线<br>
◌ 论文牧场 · 篱笆双线<br>
▦ 湖畔村落 · 小径虚线<br>
♣ 灵感果园 · 花篱点线<br>
⌂ 小屋＝hub · ★＝地标<br>
<span style="color:var(--fail)">▲</span>红＝管线失败 · ○＝待处理</div>
<div class="status"><span id="stCount" class="ok"></span><span id="stCam"></span><span id="stFps"></span><span>拖拽平移 · 滚轮缩放 · 双击重置 · 回车飞往首个命中 · Esc 清除</span></div>
<div id="tip"></div>
<script>
'use strict';
/* ---------- seeded 假数据：500 笔记 / 4 庄园 ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
var R=mulberry32(20260920);
function rr(a,b){return a+(b-a)*R();}
function pick(a){return a[(R()*a.length)|0];}
function gauss(){return (R()+R()+R()-1.5)/1.5;}
var LIBS=[
 {id:'tech', name:'技术梯田', tex:'terraces', topics:['向量检索','切块策略','重排模型','显存仲裁','混合检索','量化部署','索引管线','缓存设计']},
 {id:'paper',name:'论文牧场', tex:'meadow',   topics:['注意力机制','对比学习','长文建模','多模态对齐','检索增强','扩散模型','稀疏激活','评估基准']},
 {id:'meet', name:'湖畔村落', tex:'village',  topics:['周会纪要','评审决议','排期对齐','故障复盘','需求澄清','okr 制定','面试记录','发布检查']},
 {id:'spark',name:'灵感果园', tex:'orchard',  topics:['产品脑洞','交互灵感','叙事结构','视觉拼贴','城市观察','梦境记录','阅读摘抄','实验想法']}
];
var SUF=['札记','速记','精读','复盘','备忘','摘录','梳理','拾遗','考','谈','碎笔','深读'];
var seen={};
function mkTitle(topic){var t=topic+pick(SUF);if(seen[t]){seen[t]++;return t+'·'+String(seen[t]).padStart(2,'0');}seen[t]=1;return t;}
var SUM_A=['要点梳理与复用清单','含方法步骤与坑点','附对比表与引用','可直接复用的结论','含待办与后续问题'];
var SUM_B=['已沉淀为模板','仍在补充案例','等一次集中重写','引用较多值得重读','与三篇旧记相关'];
function mkSum(topic,chunks){return topic+'·'+pick(SUM_A)+'，'+chunks+' 块，'+pick(SUM_B)+'。';}
var WORLD={w:1600,h:1000};
var CENTERS=[[430,420],[1170,400],[430,780],[1170,770]];
var ZR={x:330,y:210}; // 庄园椭圆半径
var NOTES=[];
(function(){
  var order=[];for(var i=0;i<500;i++)order.push(i%4);
  for(var i=order.length-1;i>0;i--){var j=(R()*(i+1))|0;var t=order[i];order[i]=order[j];order[j]=t;}
  var base=new Date(2026,8,10).getTime();
  for(var k=0;k<500;k++){
    var li=order[k],L=LIBS[li],c=CENTERS[li],topic=pick(L.topics);
    var sr=R(),st=sr<0.70?'ok':sr<0.85?'partial':sr<0.93?'failed':'pending';
    var d=new Date(base-((R()*180)|0)*864e5);
    var chunks=1+((Math.pow(R(),2.4)*120)|0);
    NOTES.push({id:k,lib:li,title:mkTitle(topic),topic:topic,sum:mkSum(topic,chunks),
      updated:d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),
      chunks:chunks,status:st,
      x:c[0]+gauss()*255,y:c[1]+gauss()*165,ph:R()*6.28,sp:rr(1.2,3.2)});
  }
  LIBS.forEach(function(L,li){
    var arr=NOTES.filter(function(n){return n.lib===li;}).sort(function(a,b){return b.chunks-a.chunks;});
    arr.forEach(function(n,idx){n.rank=idx;n.hub=idx<5;n.capital=idx===0;});
  });
})();
var state={density:500,vis:[true,true,true,true],q:'',hits:[],hover:-1,
  cam:{x:800,y:540,k:1},tween:null,theme:'light',reduced:matchMedia('(prefers-reduced-motion: reduce)').matches};
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var base=document.createElement('canvas'),btx=base.getContext('2d');
var DPR=1,W=0,H=0,baseDirty=true;
function cssVar(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function libColor(li){return cssVar('--c'+li);}
function fit(){var k=Math.min(W/WORLD.w,H/WORLD.h)*0.98;state.cam={x:800,y:540,k:k};state.tween=null;baseDirty=true;}
function resize(){DPR=Math.min(devicePixelRatio||1,1.5);W=innerWidth;H=innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px';
  base.width=W*DPR;base.height=H*DPR;fit();}
addEventListener('resize',resize);
function w2s(x,y){return [(x-state.cam.x)*state.cam.k+W/2,(y-state.cam.y)*state.cam.k+H/2];}
function hexA(hex,a){var n=parseInt(hex.slice(1),16);return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')';}
/* ---------- 底图：天空＋远山＋庄园地貌＋河流（相机变化才重绘） ---------- */
function drawBase(){
  btx.setTransform(DPR,0,0,DPR,0,0);
  var dark=state.theme==='dark';
  var sky=btx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,cssVar('--sky1'));sky.addColorStop(0.55,cssVar('--sky2'));
  sky.addColorStop(0.551,dark?'#3E5A44':'#7CB46A');sky.addColorStop(1,dark?'#2A4030':'#A9D18E');
  btx.fillStyle=sky;btx.fillRect(0,0,W,H);
  // 太阳（深色＝低垂暮日，浅色＝正午暖阳）
  var sun=w2s(dark?1250:300,dark?300:170),sunR=(dark?46:34)*state.cam.k+18;
  btx.fillStyle=cssVar('--sun');btx.globalAlpha=dark?0.85:0.9;
  btx.beginPath();btx.arc(sun[0],sun[1],sunR,0,6.29);btx.fill();
  btx.globalAlpha=dark?0.18:0.25;
  btx.beginPath();btx.arc(sun[0],sun[1],sunR*2.1,0,6.29);btx.fill();btx.globalAlpha=1;
  // 远山两重（世界坐标）
  function range(pts,fill){
    btx.fillStyle=fill;btx.beginPath();
    var p0=w2s(pts[0][0],pts[0][1]);btx.moveTo(p0[0],p0[1]);
    for(var i=1;i<pts.length;i++){var p=w2s(pts[i][0],pts[i][1]);btx.lineTo(p[0],p[1]);}
    var e1=w2s(1600,560),e0=w2s(0,560);btx.lineTo(e1[0],e1[1]);btx.lineTo(e0[0],e0[1]);btx.closePath();btx.fill();
  }
  range([[0,470],[200,330],[420,440],[640,300],[880,450],[1120,320],[1360,440],[1600,350]],dark?'#3A4666':'#8FA9C9');
  range([[0,520],[260,400],[520,500],[780,390],[1040,505],[1300,400],[1600,490]],dark?'#31435A':'#A9C6A4');
  // 庄园地貌：淡底＋篱笆线型＋肌理（四库手法各异）
  var k=state.cam.k;
  LIBS.forEach(function(L,li){
    if(!state.vis[li])return;
    var c=w2s(CENTERS[li][0],CENTERS[li][1]),rx=ZR.x*k,ry=ZR.y*k,col=libColor(li);
    btx.save();
    btx.fillStyle=col;btx.globalAlpha=dark?0.10:0.13;
    btx.beginPath();btx.ellipse(c[0],c[1],rx,ry,0,0,6.29);btx.fill();
    btx.globalAlpha=1;
    // 肌理（裁剪进椭圆）
    btx.beginPath();btx.ellipse(c[0],c[1],rx,ry,0,0,6.29);btx.clip();
    btx.strokeStyle=col;btx.fillStyle=col;
    if(L.tex==='terraces'){ // 梯田弧线
      btx.globalAlpha=dark?0.28:0.32;btx.lineWidth=1.4;
      for(var yy=-ry;yy<ry;yy+=13){btx.beginPath();btx.ellipse(c[0],c[1]+yy,rx*Math.sqrt(Math.max(0.05,1-(yy*yy)/(ry*ry))),7,0,0.15*Math.PI,0.85*Math.PI);btx.stroke();}
    }else if(L.tex==='meadow'){ // 牧场圆点
      btx.globalAlpha=dark?0.25:0.30;
      for(var ay=-ry+10;ay<ry;ay+=22)for(var ax=-rx+10;ax<rx;ax+=22){
        if((ax*ax)/(rx*rx)+(ay*ay)/(ry*ry)>0.92)continue;
        btx.beginPath();btx.arc(c[0]+ax,c[1]+ay,2.2,0,6.29);btx.fill();}
    }else if(L.tex==='village'){ // 村落方格
      btx.globalAlpha=dark?0.20:0.24;btx.lineWidth=1;
      btx.beginPath();
      for(var gx=-rx;gx<=rx;gx+=26){btx.moveTo(c[0]+gx,c[1]-ry);btx.lineTo(c[0]+gx,c[1]+ry);}
      for(var gy=-ry;gy<=ry;gy+=26){btx.moveTo(c[0]-rx,c[1]+gy);btx.lineTo(c[0]+rx,c[1]+gy);}
      btx.stroke();
    }else{ // 果园行栽：小树三角
      btx.globalAlpha=dark?0.30:0.34;
      for(var by=-ry+14;by<ry;by+=30)for(var bx=-rx+14;bx<rx;bx+=34){
        if((bx*bx)/(rx*rx)+(by*by)/(ry*ry)>0.9)continue;
        var tx=c[0]+bx,ty=c[1]+by;
        btx.beginPath();btx.moveTo(tx,ty-5);btx.lineTo(tx+4,ty+3);btx.lineTo(tx-4,ty+3);btx.closePath();btx.fill();}
    }
    btx.globalAlpha=1;btx.restore();
    // 湖畔村落中央小湖
    if(li===2){
      var lk=w2s(CENTERS[2][0]+60,CENTERS[2][1]+30);
      btx.fillStyle=dark?'#3E6E8E':'#5FA8D3';btx.globalAlpha=0.85;
      btx.beginPath();btx.ellipse(lk[0],lk[1],70*k,42*k,0.3,0,6.29);btx.fill();
      btx.globalAlpha=0.5;btx.strokeStyle='#fff';btx.lineWidth=1.5;
      btx.beginPath();btx.ellipse(lk[0],lk[1],52*k,30*k,0.3,Math.PI*1.1,Math.PI*1.6);btx.stroke();
      btx.globalAlpha=1;
    }
    // 篱笆边界（线型四库各异）
    btx.strokeStyle=col;btx.lineWidth=2;
    if(li===0)btx.setLineDash([]);
    else if(li===1){btx.setLineDash([]);btx.lineWidth=4;btx.globalAlpha=0.55;
      btx.beginPath();btx.ellipse(c[0],c[1],rx+7,ry+7,0,0,6.29);btx.stroke();btx.globalAlpha=1;btx.lineWidth=1.6;}
    else if(li===2)btx.setLineDash([12,8]);
    else btx.setLineDash([2,7]);
    btx.beginPath();btx.ellipse(c[0],c[1],rx,ry,0,0,6.29);btx.stroke();
    btx.setLineDash([]);
  });
  // 蜿蜒河流（穿过两村之间）
  btx.strokeStyle=dark?'#4E7FA0':'#3E8FD1';btx.lineWidth=Math.max(4,12*k);btx.lineCap='round';btx.globalAlpha=0.8;
  btx.beginPath();
  var rp=[[800,180],[760,420],[840,620],[780,860],[820,1020]];
  rp.forEach(function(p,i){var s=w2s(p[0],p[1]);i?btx.lineTo(s[0],s[1]):btx.moveTo(s[0],s[1]);});
  btx.stroke();btx.globalAlpha=1;
  baseDirty=false;
}
var STATUS_TXT={ok:'索引正常',partial:'部分生效',failed:'管线失败',pending:'待处理'};
function visibleNotes(){
  return NOTES.filter(function(n){
    if(!state.vis[n.lib])return false;
    if(state.density===500)return true;
    if(state.density===150)return (n.id%10)<3;
    return (n.id%10)===0;});
}
function matchQ(n,s){return n.title.toLowerCase().indexOf(s)>=0||n.topic.toLowerCase().indexOf(s)>=0||
  n.sum.toLowerCase().indexOf(s)>=0||LIBS[n.lib].name.indexOf(state.q.trim())>=0;}
var stCount=document.getElementById('stCount'),stCam=document.getElementById('stCam'),stFps=document.getElementById('stFps');
var tip=document.getElementById('tip'),q=document.getElementById('q'),hitsEl=document.getElementById('hits');
/* 环境：云 / 鸟 / 花粉 */
var clouds=[];for(var ci=0;ci<4;ci++)clouds.push({x:rr(0,1600),y:rr(90,260),s:rr(0.7,1.3),sp:rr(6,14)});
var birds=[];for(var bi2=0;bi2<5;bi2++)birds.push({x:rr(0,1600),y:rr(150,330),sp:rr(18,30),ph:R()*6.28});
var pollen=[];for(var pi=0;pi<12;pi++)pollen.push({x:R()*1600,y:rr(300,950),ph:R()*6.28,sp:rr(0.5,1.4)});
var lastT=0,fpsE=60;
function drawHouse(g,x,y,s,lib,col,hub,dark){
  g.fillStyle=hub?(dark?'#F5EFE0':'#FFFFFF'):hexA(col.startsWith('#')?col:'#888888',0.9);
  g.fillRect(x-s*0.55,y-s*0.5,s*1.1,s*0.6);
  g.fillStyle=col;g.beginPath();
  if(lib===0){g.rect(x-s*0.65,y-s*0.95,s*1.3,s*0.5);}                       // 平顶仓
  else if(lib===1){g.moveTo(x-s*0.7,y-s*0.45);g.lineTo(x,y-s*1.15);g.lineTo(x+s*0.7,y-s*0.45);} // 尖顶
  else if(lib===2){g.arc(x,y-s*0.45,s*0.62,Math.PI,0);}                      // 圆顶
  else{var tw2=s*0.28;g.moveTo(x-tw2,y-s*0.45);g.lineTo(x-tw2,y-s*1.5);g.lineTo(x+tw2,y-s*1.5);g.lineTo(x+tw2,y-s*0.45);} // 高塔仓
  g.fill();
  if(lib===3&&!state.reduced){} // 果仓顶灯在 frame 里另画
}
function frame(t){
  requestAnimationFrame(frame);
  var now=t/1000,dt=Math.min(0.05,now-(lastT||now));lastT=now;if(dt>0)fpsE=fpsE*0.95+(1/Math.max(dt,1e-3))*0.05;
  if(state.tween){var tw=state.tween,f=Math.min(1,(now-tw.t0)/0.6),e=1-Math.pow(1-f,3);
    state.cam.x=tw.x0+(tw.x1-tw.x0)*e;state.cam.y=tw.y0+(tw.y1-tw.y0)*e;state.cam.k=tw.k0+(tw.k1-tw.k0)*e;
    baseDirty=true;if(f>=1)state.tween=null;}
  if(state.reduced&&!baseDirty&&!state.tween)return;
  if(baseDirty)drawBase();
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);ctx.drawImage(base,0,0,W,H);
  var k=state.cam.k,qs=state.q.trim(),dimQs=qs.length>0,sl=qs.toLowerCase(),dark=state.theme==='dark';
  var list=visibleNotes();
  list.forEach(function(n){n._hit=dimQs?matchQ(n,sl):false;});
  // 云（环境动效）
  if(!state.reduced)clouds.forEach(function(c){
    c.x+=c.sp*dt;if(c.x>1750)c.x=-150;
    var s=w2s(c.x,c.y),cs=c.s*(0.8+k*0.5);
    ctx.fillStyle=dark?'rgba(60,55,90,.85)':'rgba(255,255,255,.9)';
    ctx.beginPath();
    ctx.arc(s[0],s[1],16*cs,0,6.29);ctx.arc(s[0]+18*cs,s[1]+3*cs,12*cs,0,6.29);ctx.arc(s[0]-18*cs,s[1]+4*cs,11*cs,0,6.29);
    ctx.fill();});
  // 鸟
  if(!state.reduced)birds.forEach(function(b){
    b.x+=b.sp*dt;if(b.x>1700)b.x=-100;
    var s=w2s(b.x,b.y+Math.sin(now*2+b.ph)*8),fl=Math.sin(now*9+b.ph)*3;
    ctx.strokeStyle=dark?'#1B2138':'#3A4A5A';ctx.lineWidth=1.6;ctx.beginPath();
    ctx.moveTo(s[0]-7,s[1]);ctx.quadraticCurveTo(s[0]-2,s[1]-4-fl,s[0],s[1]);
    ctx.quadraticCurveTo(s[0]+2,s[1]-4-fl,s[0]+7,s[1]);ctx.stroke();});
  // 节点：苗点 / 小屋 / 地标
  var dotR=state.density===500?2.6:state.density===150?3.2:4;
  var labelCap=state.density===500?8:state.density===150?22:64,labels=0;
  var sorted=list.slice().sort(function(a,b){return (b.capital-a.capital)||(b.hub-a.hub)||(b.chunks-a.chunks);});
  sorted.forEach(function(n){
    var s=w2s(n.x,n.y);if(s[0]<-50||s[1]<-50||s[0]>W+50||s[1]>H+50)return;
    var col=n.status==='failed'?cssVar('--fail'):n.status==='pending'?cssVar('--pend'):libColor(n.lib);
    var dimA=dimQs?(n._hit?1:0.12):1;
    ctx.globalAlpha=dimA;
    if(n.capital){
      var cs2=(10+k*4);
      drawHouse(ctx,s[0],s[1],cs2,n.lib,col,true,dark);
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s[0],s[1]-cs2*1.15,2.4,0,6.29);ctx.fill();
    }else if(n.hub){
      drawHouse(ctx,s[0],s[1],7+k*2,n.lib,col,true,dark);
    }else{
      ctx.fillStyle=col;
      ctx.beginPath();ctx.arc(s[0],s[1],dotR,0,6.29);ctx.fill();
      ctx.strokeStyle=col;ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(s[0],s[1]-dotR);ctx.lineTo(s[0],s[1]-dotR-4);ctx.stroke();
    }
    if(n.status==='failed'){ctx.fillStyle=cssVar('--fail');ctx.beginPath();
      ctx.moveTo(s[0],s[1]-9);ctx.lineTo(s[0]+6,s[1]+2);ctx.lineTo(s[0]-6,s[1]+2);ctx.closePath();ctx.fill();}
    if(n.id===state.hover||n._hit){ctx.strokeStyle='#fff';ctx.lineWidth=1.4;
      ctx.beginPath();ctx.arc(s[0],s[1],11+(n._hit&&!state.reduced?Math.sin(now*4)*1.5:0),0,6.29);ctx.stroke();}
    var want=n.capital||(n.hub&&state.density!==500)||(state.density===50&&n.chunks>40)||n._hit||n.id===state.hover;
    if(want&&labels<labelCap){labels++;
      ctx.globalAlpha=dimQs&&!n._hit?0.15:1;
      ctx.font=(n.capital?'700 ':'')+'12px "Segoe UI","Microsoft YaHei",sans-serif';
      ctx.fillStyle=cssVar('--ink');ctx.textAlign='center';
      ctx.fillText(n.capital?'★ '+n.title:n.title,s[0],s[1]-20);
      ctx.font='10px Consolas,monospace';ctx.fillStyle=cssVar('--sec');
      ctx.fillText(n.chunks+' 块 · '+STATUS_TXT[n.status],s[0],s[1]+14);
      ctx.globalAlpha=1;}
    ctx.globalAlpha=1;
  });
  // 地标风车（论文牧场首都）： rotating blades
  var wmCap=NOTES.filter(function(n){return n.capital&&n.lib===1&&state.vis[1];})[0];
  if(wmCap){var ws=w2s(wmCap.x,wmCap.y-26),ang=state.reduced?0.6:now*0.9;
    ctx.strokeStyle=dark?'#E8E2D2':'#5A4A33';ctx.lineWidth=3;ctx.beginPath();
    ctx.moveTo(ws[0],ws[1]);ctx.lineTo(ws[0],ws[1]-22);ctx.stroke();
    for(var wi=0;wi<4;wi++){var a2=ang+wi*Math.PI/2;
      ctx.strokeStyle=libColor(1);ctx.lineWidth=2.4;ctx.beginPath();
      ctx.moveTo(ws[0],ws[1]-22);ctx.lineTo(ws[0]+Math.cos(a2)*16,ws[1]-22+Math.sin(a2)*16);ctx.stroke();}}
  // 花粉微粒
  if(!state.reduced)pollen.forEach(function(p){
    if(!state.vis[(p.x/400)|0%4])return;
    var s=w2s(p.x+Math.sin(now*p.sp+p.ph)*20,p.y+Math.cos(now*p.sp*0.7+p.ph)*12);
    ctx.fillStyle='#FFF7D6';ctx.globalAlpha=0.55+0.3*Math.sin(now*2+p.ph);
    ctx.fillRect(s[0],s[1],2.2,2.2);ctx.globalAlpha=1;});
  // 庄园铭牌
  ctx.textAlign='center';
  var SYM=['▤','◌','▦','♣'];
  LIBS.forEach(function(L,li){if(!state.vis[li])return;
    var s=w2s(CENTERS[li][0],CENTERS[li][1]-ZR.y-28),col=libColor(li);
    ctx.font='700 13px "Segoe UI","Microsoft YaHei",sans-serif';
    var txt=SYM[li]+' '+L.name+' · 125 篇',wpx=ctx.measureText(txt).width+22;
    ctx.fillStyle=cssVar('--float');ctx.strokeStyle=col;ctx.lineWidth=1.2;
    ctx.beginPath();ctx.rect(s[0]-wpx/2,s[1]-13,wpx,24);ctx.fill();ctx.stroke();
    ctx.fillStyle=col;ctx.fillText(txt,s[0],s[1]+4);});
  stCount.textContent='可见 '+list.length+' / 500 · '+state.density+' 档';
  stCam.textContent='缩放 '+Math.round(state.cam.k/(Math.min(W/WORLD.w,H/WORLD.h)*0.98)*100)+'%';
  stFps.textContent='FPS '+Math.round(fpsE)+' · 单 rAF · 云4＋鸟5＋粉尘12';
}
/* ---------- 交互 ---------- */
var libsEl=document.getElementById('libs');
LIBS.forEach(function(L,li){
  var b=document.createElement('button');b.className='chip';
  b.innerHTML='<i style="background:var(--c'+li+')"></i>'+L.name+' <small>125</small>';
  b.onclick=function(){var on=state.vis.filter(Boolean).length;
    if(state.vis[li]&&on===1)return;state.vis[li]=!state.vis[li];
    b.classList.toggle('off',!state.vis[li]);baseDirty=true;refreshHits();};
  libsEl.appendChild(b);
});
document.getElementById('dens').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  this.querySelectorAll('button').forEach(function(x){x.classList.remove('on');});
  b.classList.add('on');state.density=+b.dataset.n;baseDirty=true;});
document.getElementById('theme').onclick=function(){
  state.theme=state.theme==='dark'?'light':'dark';
  document.documentElement.dataset.theme=state.theme;
  this.textContent=state.theme==='dark'?'白昼':'暮色';baseDirty=true;};
function refreshHits(){
  var s=state.q.trim().toLowerCase();
  if(!s){state.hits=[];hitsEl.textContent='';return;}
  state.hits=NOTES.filter(function(n){return state.vis[n.lib]&&matchQ(n,s);});
  hitsEl.textContent='命中 '+state.hits.length;}
var deb=null;
q.addEventListener('input',function(){state.q=q.value;clearTimeout(deb);deb=setTimeout(refreshHits,160);});
q.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&state.hits.length){var n=state.hits[0],k0=Math.min(W/WORLD.w,H/WORLD.h)*0.98;
    state.tween={x0:state.cam.x,y0:state.cam.y,k0:state.cam.k,x1:n.x,y1:n.y,k1:Math.max(state.cam.k,k0*1.4),t0:performance.now()/1000};}
  if(e.key==='Escape'){q.value='';state.q='';refreshHits();}});
var drag=null;
cv.addEventListener('pointerdown',function(e){drag={x:e.clientX,y:e.clientY};cv.classList.add('drag');cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointermove',function(e){
  if(drag){state.cam.x-=(e.clientX-drag.x)/state.cam.k;state.cam.y-=(e.clientY-drag.y)/state.cam.k;
    drag={x:e.clientX,y:e.clientY};baseDirty=true;state.tween=null;return;}
  var mx=e.clientX,my=e.clientY,best=null,bd=15;
  var list=visibleNotes();
  for(var i=0;i<list.length;i++){var n=list[i],s=w2s(n.x,n.y);
    var d=Math.hypot(s[0]-mx,s[1]-my);if(d<bd){bd=d;best=n;}}
  state.hover=best?best.id:-1;
  if(best){tip.style.display='block';tip.style.left=(mx+16)+'px';tip.style.top=(my+14)+'px';
    tip.innerHTML='<b>'+best.title+'</b><br><span class="dot" style="background:var(--c'+best.lib+')"></span>'+LIBS[best.lib].name+' · '+best.topic+'<br><span class="m">'+best.updated+' · '+best.chunks+' 块 · '+STATUS_TXT[best.status]+'</span>';}
  else tip.style.display='none';});
cv.addEventListener('pointerup',function(){drag=null;cv.classList.remove('drag');});
cv.addEventListener('wheel',function(e){e.preventDefault();
  var mx=e.clientX-W/2,my=e.clientY-H/2;
  var wx=state.cam.x+mx/state.cam.k,wy=state.cam.y+my/state.cam.k;
  state.cam.k=Math.min(4,Math.max(0.25,state.cam.k*Math.exp(-e.deltaY*0.0012)));
  state.cam.x=wx-mx/state.cam.k;state.cam.y=wy-my/state.cam.k;
  state.tween=null;baseDirty=true;},{passive:false});
cv.addEventListener('dblclick',fit);
resize();requestAnimationFrame(frame);
</script>
