*{margin:0;padding:0;box-sizing:border-box}

  --shadow:0 10px 26px rgba(0,0,0,.45);
}
[data-theme="light"]{
  --canvas:#F3F1EA;--float:#FFFFFF;--core2:#F1EEE5;--card:#FFFFFF;--row:#FAF8F2;
  --ink:#1B1710;--body:#33302A;--sec:#6B6558;--ph:#8D8776;

  --c-tech:#0E9F6E;--c-paper:#1D6FD1;--c-meet:#B45309;
  --ok:#0E9F6E;--part:#1D6FD1;--fail:#DC2626;
  --shadow:0 10px 24px rgba(80,65,20,.13);
}
html,body{height:100%}
body{background:var(--canvas);color:var(--body);font-family:var(--font-ui);font-size:14px;overflow:hidden}
.top{position:fixed;top:0;left:0;right:0;height:56px;z-index:30;display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--float);border-bottom:1px solid var(--hair)}
.brand{display:flex;align-items:center;gap:9px;color:var(--ink);font-weight:700;font-size:14px;white-space:nowrap}

.btn{background:var(--accent);color:#241A05;border:none;border-radius:9px;font-size:13px;font-weight:700;padding:7px 16px}
[data-theme="light"] .btn{color:#fff}
.hints{display:flex;gap:7px;margin-top:8px;flex-wrap:wrap}
.hints button{font-size:11.5px;color:var(--sec);background:var(--float);border:1px solid var(--hair);border-radius:99px;padding:4px 12px}
.layout{position:fixed;inset:56px 0 0 0;display:flex}
.list{width:372px;flex:none;border-right:1px solid var(--hair);display:flex;flex-direction:column;background:var(--float);padding-top:148px}
.list-tools{padding:10px 14px;border-bottom:1px solid var(--hair);display:flex;gap:8px;align-items:center}

.banner{display:none;margin:10px 14px 0;border:1px solid var(--accent-line);border-radius:10px;padding:8px 12px;font-size:12px;color:var(--sec)}

.rows{flex:1;overflow:auto;padding:8px 10px 70px}

.ghead span{font-family:var(--font-mono);font-size:10px;color:var(--ph);font-weight:400}
.rowitem{display:block;width:100%;text-align:left;background:var(--row);border:1px solid var(--hair);border-left:4px solid var(--sec);border-radius:10px;padding:9px 12px;margin-bottom:8px;cursor:pointer;transition:opacity .3s,border-color .2s}

.rtop{display:flex;align-items:center;gap:7px}
.st{width:8px;height:8px;border-radius:50%;flex:none}

.rmeta{font-family:var(--font-mono);font-size:10px;color:var(--ph);margin-top:6px}

.libchip{font-size:11px;border-radius:6px;padding:2px 9px;color:#fff;font-weight:700}
.chip{font-family:var(--font-mono);font-size:10.5px;padding:2px 9px;border-radius:6px}

.chip.wait{background:rgba(251,191,36,.14);color:var(--c-meet)}
.chip.bad{background:rgba(248,113,113,.14);color:var(--fail)}

.path{font-family:var(--font-mono);font-size:11px;color:var(--ph);word-break:break-all}
.smeta{font-family:var(--font-mono);font-size:11px;color:var(--sec);margin-top:8px;display:flex;gap:14px;flex-wrap:wrap}
.sum{font-size:14px;line-height:1.9;margin-top:12px}
.sum mark{background:var(--accent-dim);color:var(--ink);border-radius:3px;padding:0 3px}
.tags{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}

.sec{margin-top:18px}.sec h5{font-size:11px;color:var(--ph);letter-spacing:.06em;margin-bottom:8px;font-weight:500}
.snip{font-size:13.5px;line-height:1.85;background:var(--core2);border:1px solid var(--hair);border-radius:10px;padding:11px 13px}
.snip mark{background:var(--accent-dim);color:var(--ink);border-radius:3px;padding:0 3px}
.pipes{display:flex;gap:6px;flex-wrap:wrap}
.rel{display:flex;gap:8px;width:100%;text-align:left;padding:8px 11px;border-radius:9px;font-size:13px;color:var(--body);background:transparent;border:1px solid transparent}
.rel:hover{background:var(--core2);color:var(--ink)}
.rel .s{font-family:var(--font-mono);font-size:10.5px;color:var(--accent);margin-left:auto}
.ego{border:1px solid var(--hair);border-radius:12px;background:var(--core2);padding:8px}
.ego svg{display:block;width:100%;height:auto}
.ego-cap{font-size:11px;color:var(--ph);padding:6px 4px 2px;line-height:1.7}
.acts{display:flex;gap:8px;margin-top:18px}
.acts button{font-size:13px;border-radius:10px;padding:8px 16px}

.acts .pri{background:var(--accent);color:#241A05;border:none;font-weight:700;flex:1}
[data-theme="light"] .acts .pri{color:#fff}
/* 右轨 */
.rail{width:236px;flex:none;border-left:1px solid var(--hair);background:var(--float);overflow:auto;padding:158px 0 70px}
.rail h3{font-size:13px;color:var(--ink);display:flex;justify-content:space-between;padding:0 14px}
.rail h3 span{font-family:var(--font-mono);font-size:10px;color:var(--ph);font-weight:400}
.cap{font-size:10px;color:var(--ph);letter-spacing:.08em;margin:10px 14px 2px}
.row{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;padding:4px 14px;gap:8px}
.row input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px}
.row input[type=range]{flex:1;accent-color:var(--accent)}
.seg{display:flex;border:1px solid var(--hair);border-radius:8px;overflow:hidden}
.seg button{font-size:11px;color:var(--sec);padding:3px 8px;background:transparent;border:none}
.seg button.on{background:var(--accent-dim);color:var(--ink)}
.thv{font-family:var(--font-mono);font-size:10.5px;color:var(--accent)}
.legend{position:fixed;left:16px;bottom:52px;z-index:25;background:var(--float);border:1px solid var(--hair);border-radius:12px;padding:9px 13px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;max-width:46vw;box-shadow:var(--shadow)}
.li{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--sec)}
.swd{width:9px;height:9px;border-radius:3px;display:inline-block}
.info{width:22px;height:22px;border-radius:50%;border:1px solid var(--hair2);color:var(--sec);font-size:11px;font-weight:700;background:transparent}
.zoom{position:fixed;right:16px;bottom:52px;z-index:25;display:flex;flex-direction:column;gap:7px;align-items:flex-end}
.zoom button{width:34px;height:34px;border-radius:10px;background:var(--float);border:1px solid var(--hair);color:var(--sec);font-size:15px}
.zlab{font-family:var(--font-mono);font-size:10.5px;color:var(--ph)}

.status b{color:var(--ink)}

.mech{position:fixed;left:388px;bottom:112px;z-index:26;width:340px;background:var(--float);border:1px solid var(--hair);border-radius:13px;box-shadow:var(--shadow);padding:13px 15px;display:none}

.list.compact .rsum{display:none}.list.compact .rowitem{padding:6px 10px}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
@media (max-width:1150px){.rail{display:none}.list{width:320px}}
</style>
