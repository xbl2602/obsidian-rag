*{margin:0;padding:0;box-sizing:border-box}

}
[data-theme="light"]{
  --canvas:#F6F1E9;--float:#FFFFFF;--core2:#F3EDE1;--card:#FFFFFF;
  --ink:#211912;--body:#3A332A;--sec:#6E6455;--ph:#93887A;

  --shadow:0 10px 24px rgba(90,60,20,.13);
}
html,body{height:100%}
body{background:var(--canvas);color:var(--body);font-family:var(--font-ui);font-size:14px;overflow:hidden}
.top{position:fixed;top:0;left:0;right:0;height:56px;z-index:30;display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--float);border-bottom:1px solid var(--hair)}
.brand{display:flex;align-items:center;gap:9px;color:var(--ink);font-weight:700;font-size:14px;white-space:nowrap}
.brand i{width:16px;height:16px;background:var(--accent);display:inline-block;border-radius:50% 50% 4px 4px;opacity:.9}
.tag{font-family:var(--font-mono);font-size:10.5px;color:var(--sec);border:1px solid var(--hair);border-radius:99px;padding:2px 10px;white-space:nowrap}
.scope{display:flex;gap:6px}.scope button{font-size:12px;color:var(--sec);border:1px solid var(--hair);border-radius:99px;padding:4px 12px;background:transparent}

.spacer{flex:1}.theme-btn{font-size:12px;color:var(--sec);border:1px solid var(--hair);border-radius:9px;padding:5px 12px;background:transparent}

.island{display:flex;align-items:center;gap:8px;background:var(--float);border:1px solid var(--hair2);border-radius:14px;padding:8px 8px 8px 13px;box-shadow:var(--shadow)}

.hints{display:flex;gap:7px;margin-top:8px;flex-wrap:wrap}
.hints button{font-size:11.5px;color:var(--sec);background:var(--float);border:1px solid var(--hair);border-radius:99px;padding:4px 12px}
.layout{position:fixed;inset:56px 0 0 0;display:flex}
.side{width:230px;flex:none;overflow:auto;background:var(--float);border-right:1px solid var(--hair);padding:150px 0 70px}
.side h3{font-size:13px;color:var(--ink);display:flex;justify-content:space-between;padding:0 14px}
.side h3 span{font-family:var(--font-mono);font-size:10px;color:var(--ph);font-weight:400}
.cap{font-size:10px;color:var(--ph);letter-spacing:.08em;margin:10px 14px 2px}
.row{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;padding:4px 14px;gap:8px}
.row input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px}

.seg{display:flex;border:1px solid var(--hair);border-radius:8px;overflow:hidden}
.seg button{font-size:11px;color:var(--sec);padding:3px 8px;background:transparent;border:none}
.seg button.on{background:var(--accent-dim);color:var(--ink)}
.thv{font-family:var(--font-mono);font-size:10.5px;color:var(--accent)}
.main{flex:1;min-width:0;overflow:auto;padding:150px 20px 90px}
.banner{display:none;background:var(--float);border:1px solid var(--accent-line);border-radius:13px;padding:11px 15px;margin-bottom:14px;box-shadow:var(--shadow);align-items:center;gap:10px}
.banner.on{display:flex}.banner b{color:var(--ink)}
.banner .x{margin-left:auto;border:1px solid var(--hair);border-radius:50%;width:22px;height:22px;color:var(--sec);background:transparent}
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.toolbar select{background:var(--float);color:var(--sec);border:1px solid var(--hair);border-radius:8px;font-size:12px;padding:5px 8px}
.toolbar .one{font-family:var(--font-mono);font-size:10.5px;color:var(--ph)}
.avenues{display:flex;gap:14px;align-items:flex-start}
.ave{flex:1;min-width:0;border-radius:16px;padding:12px;background:var(--float);border:1px solid var(--hair);border-top:4px solid var(--sec)}

.ave-s{font-family:var(--font-mono);font-size:10px;color:var(--sec);margin-bottom:10px}
.cardwall{display:flex;flex-direction:column;gap:10px}
.post{background:var(--card);border:1px solid var(--hair);border-radius:13px;padding:12px 13px;box-shadow:var(--shadow);cursor:pointer;transition:opacity .3s,border-color .2s;position:relative}
.post:hover{border-color:var(--hair2)}
.post.dim{opacity:.3}
.post.hit{border-color:var(--accent-line)}
.post.sel{border-color:var(--accent)}
.prow{display:flex;align-items:center;gap:7px}
.st{width:8px;height:8px;border-radius:50%;flex:none}
.pt{font-size:13.5px;color:var(--ink);font-weight:700;line-height:1.45;margin-top:7px}
.ps{font-size:12.5px;color:var(--sec);line-height:1.7;margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ps mark{background:var(--accent-dim);color:var(--ink);border-radius:3px;padding:0 3px}
.pt mark{background:var(--accent-dim);color:var(--ink);border-radius:3px;padding:0 3px}
.tags{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
.tags span{font-family:var(--font-mono);font-size:10px;color:var(--ph);border:1px solid var(--hair);border-radius:99px;padding:1px 8px}
.pmeta{display:flex;gap:10px;font-family:var(--font-mono);font-size:10px;color:var(--ph);margin-top:8px;flex-wrap:wrap}
.scorebadge{font-family:var(--font-mono);font-size:10px;color:var(--accent);border:1px solid var(--accent-line);border-radius:6px;padding:1px 7px;display:none;margin-left:auto}
.post.hit .scorebadge{display:inline-block}
.strip{display:flex;align-items:center;gap:5px;margin-top:9px;padding-top:8px;border-top:1px dashed var(--hair)}
.strip .lbl{font-family:var(--font-mono);font-size:9.5px;color:var(--ph)}
.mdot{width:11px;height:11px;border-radius:50%;flex:none;border:1px solid rgba(0,0,0,.25)}
.mdot.dia{border-radius:3px;transform:rotate(45deg);width:9px;height:9px}
.strip .more{font-family:var(--font-mono);font-size:9.5px;color:var(--ph)}
.drill{position:fixed;top:56px;right:0;bottom:0;width:400px;max-width:94vw;z-index:28;background:var(--float);border-left:1px solid var(--hair);box-shadow:var(--shadow);transform:translateX(105%);transition:transform .38s var(--ease);display:flex;flex-direction:column}
.drill.on{transform:none}
.drill-h{padding:16px 18px 12px;border-bottom:1px solid var(--hair)}
.drill-h .prow{display:flex;gap:8px;align-items:center}
.libchip{font-size:11px;border-radius:6px;padding:2px 9px;color:#fff;font-weight:700}
.chip{font-family:var(--font-mono);font-size:10.5px;padding:2px 9px;border-radius:6px}
.chip.ok{background:var(--accent-dim);color:var(--accent)}
.chip.wait{background:rgba(251,191,36,.14);color:var(--c-meet)}
.chip.bad{background:rgba(248,113,113,.14);color:var(--fail)}
.drill-t{font-size:17px;font-weight:700;color:var(--ink);margin-top:8px;line-height:1.4}
.drill-p{font-family:var(--font-mono);font-size:10.5px;color:var(--ph);margin-top:3px;word-break:break-all}
.drill-m{font-family:var(--font-mono);font-size:10.5px;color:var(--sec);margin-top:8px;display:flex;gap:12px}
.drill-b{flex:1;overflow:auto;padding:14px 18px}
.sec{margin-bottom:16px}.sec h5{font-size:11px;color:var(--ph);margin-bottom:7px;letter-spacing:.06em;font-weight:500}
.snip{font-size:13px;line-height:1.8;background:var(--core2);border:1px solid var(--hair);border-radius:10px;padding:10px 12px}
.snip mark{background:var(--accent-dim);color:var(--ink);border-radius:3px;padding:0 3px}
.rel{display:flex;gap:8px;width:100%;text-align:left;padding:7px 10px;border-radius:8px;font-size:12.5px;color:var(--body);background:transparent;border:1px solid transparent}
.rel:hover{background:var(--core2);color:var(--ink)}
.rel .s{font-family:var(--font-mono);font-size:10.5px;color:var(--accent);margin-left:auto}
.drill-f{padding:12px 18px;border-top:1px solid var(--hair);display:flex;gap:8px}
.legend{position:fixed;left:246px;bottom:52px;z-index:25;background:var(--float);border:1px solid var(--hair);border-radius:12px;padding:9px 13px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;box-shadow:var(--shadow);max-width:calc(100vw - 300px)}
.li{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--sec)}
.swd{width:9px;height:9px;border-radius:50%;display:inline-block}
.info{width:22px;height:22px;border-radius:50%;border:1px solid var(--hair2);color:var(--sec);font-size:11px;font-weight:700;background:transparent}
.zoom{position:fixed;right:16px;bottom:52px;z-index:25;display:flex;flex-direction:column;gap:7px;align-items:flex-end}
.zoom button{width:34px;height:34px;border-radius:10px;background:var(--float);border:1px solid var(--hair);color:var(--sec);font-size:15px}
.zlab{font-family:var(--font-mono);font-size:10.5px;color:var(--ph)}
.status{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:25;font-family:var(--font-mono);font-size:11px;color:var(--sec);background:var(--float);border:1px solid var(--hair);border-radius:99px;padding:4px 16px;white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis}
.status b{color:var(--ink)}
.tip{position:fixed;z-index:40;pointer-events:none;opacity:0;transition:opacity .15s;background:var(--float);border:1px solid var(--hair2);border-radius:10px;padding:8px 12px;max-width:320px;box-shadow:var(--shadow);transform:translate(-50%,calc(-100% - 12px))}
.tip.show{opacity:1}.tip .p{font-family:var(--font-mono);font-size:10.5px;color:var(--ink);word-break:break-all}.tip .m{font-size:10.5px;color:var(--ph);margin-top:3px}
.mech{position:fixed;left:246px;bottom:112px;z-index:26;width:350px;background:var(--float);border:1px solid var(--hair);border-radius:13px;box-shadow:var(--shadow);padding:13px 15px;display:none}
.mech.on{display:block}.mech h4{font-size:12.5px;color:var(--ink);margin-bottom:7px}.mech p{font-size:11.5px;color:var(--sec);line-height:1.7;margin-bottom:5px}.mech b{color:var(--body)}

.main.small .ps{display:none}.main.small .post{padding:9px 11px}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
@media (max-width:1150px){.avenues{flex-direction:column}.ave{width:100%}.side{width:200px}.legend{left:216px}}
</style>
