<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图谱重构 B · 深渊群岛 Abyssal Archipelago — obsidian-rag</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--font-ui:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;--font-mono:"Cascadia Code",Consolas,monospace;--ease:cubic-bezier(.32,.72,0,1)}
[data-theme="dark"]{
  --canvas:#04060A; --float:#090D13; --core2:#0D1319; --ink:#EAF0F6; --body:#B9C4D0; --sec:#7E8B99; --ph:#57616E;
  --hair:rgba(160,190,220,.11); --hair2:rgba(160,190,220,.24);
  --accent:#5EEAD4; --accent-dim:rgba(94,234,212,.12); --accent-line:rgba(94,234,212,.4);
  --isl:#0A0F15; --isl-bd:rgba(160,190,220,.16);
  --c-tech:#5EEAD4; --c-paper:#93B4FD; --c-meet:#FCD34D;
  --edge:rgba(170,200,230,.22); --node:#0E141B;
  --ok:#5EEAD4; --part:#93B4FD; --fail:#F87171; --grid:rgba(150,180,210,.06);
}
[data-theme="light"]{
  --canvas:#E9EEF3; --float:#FFFFFF; --core2:#EFF3F7; --ink:#131B24; --body:#2C3844; --sec:#5A6875; --ph:#8A97A3;
  --hair:rgba(20,40,60,.10); --hair2:rgba(20,40,60,.24);
  --accent:#0D9488; --accent-dim:rgba(13,148,136,.10); --accent-line:rgba(13,148,136,.45);
  --isl:#FFFFFF; --isl-bd:rgba(20,40,60,.14);
  --c-tech:#0D9488; --c-paper:#1D5FD1; --c-meet:#B45309;
  --edge:rgba(20,40,60,.28); --node:#FFFFFF;
  --ok:#0D9488; --part:#1D5FD1; --fail:#DC2626; --grid:rgba(20,40,60,.06);
}
html,body{height:100%}
body{background:var(--canvas);color:var(--body);font-family:var(--font-ui);font-size:14px;overflow:hidden}
.top{position:fixed;top:0;left:0;right:0;height:56px;z-index:30;display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--float);border-bottom:1px solid var(--hair)}
.brand{color:var(--ink);font-weight:700;font-size:14px;display:flex;gap:9px;align-items:center;white-space:nowrap}
.brand i{width:16px;height:16px;border-radius:50%;border:2px solid var(--accent);display:inline-block}
.tag{font-family:var(--font-mono);font-size:10.5px;color:var(--sec);border:1px solid var(--hair);border-radius:99px;padding:2px 10px}
.scope{display:flex;gap:6px}
.scope button{font-size:12px;color:var(--sec);border:1px solid var(--hair);border-radius:99px;padding:4px 12px;background:transparent}
.scope button.on{color:var(--ink);border-color:var(--accent-line);background:var(--accent-dim)}
.spacer{flex:1}
.theme-btn{font-size:12px;color:var(--sec);border:1px solid var(--hair);border-radius:9px;padding:5px 12px}
.dock{position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:25;width:480px;max-width:calc(100vw - 32px)}
.island{display:flex;align-items:center;gap:8px;background:var(--float);border:1px solid var(--hair2);border-radius:99px;padding:7px 7px 7px 16px}
.island input{flex:1;min-width:0;background:transparent;border:none;outline:none;color:var(--ink);font-size:13.5px;height:30px}
.island input::placeholder{color:var(--ph)}
.island select{background:var(--core2);color:var(--sec);border:1px solid var(--hair);border-radius:99px;font-size:12px;padding:4px 8px}
.btn{background:var(--accent);color:#042622;border:none;border-radius:99px;font-size:13px;font-weight:700;padding:7px 18px}
[data-theme="light"] .btn{color:#fff}
/* 深渊舞台：点阵 +  trench 虚线 */
.stage{position:fixed;inset:56px 0 0 0;overflow:hidden;background-image:radial-gradient(circle,var(--grid) 1px,transparent 1.4px);background-size:26px 26px}
.world{position:absolute;left:0;top:0;transform-origin:0 0}
svg.lyr{position:absolute;left:-600px;top:-600px;overflow:visible}
.nodes{position:absolute;left:0;top:0}
/* 岛台：实底玄武岩卡，无模糊 */
.isl{position:absolute;border:1px solid var(--isl-bd);border-radius:20px;background:var(--isl)}
.isl::before{content:"";position:absolute;inset:6px;border:1px dashed var(--hair);border-radius:14px;pointer-events:none}
.isl-h{position:absolute;left:18px;top:-13px;display:flex;align-items:center;gap:8px;background:var(--float);border:1px solid var(--hair2);border-radius:99px;padding:3px 12px 3px 8px}
.isl-h i{width:9px;height:9px;border-radius:50%}
.isl-h b{font-size:12px;color:var(--ink)}
.isl-h span{font-family:var(--font-mono);font-size:10px;color:var(--ph)}
.trench{stroke:var(--hair2);stroke-width:1;stroke-dasharray:2 8;opacity:.7}
/* 节点：深渊卵石 —— 小圆点 + 下方标签，hub 带环 */
.nd{position:absolute;left:0;top:0;text-align:center}
.peb{position:relative;transform:translate(-50%,-50%);display:inline-flex;align-items:center;justify-content:center;background:var(--node);border:1px solid var(--hair2);cursor:grab;transition:opacity .3s,border-color .25s}
.s-md{width:26px;height:26px;border-radius:8px}
.s-pdf{width:26px;height:26px;clip-path:polygon(0 0,60% 0,100% 40%,100% 100%,0 100%);border:none !important}
.s-pdf::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.25);clip-path:polygon(60% 0,100% 40%,60% 40%)}
.s-cache{width:22px;height:22px;transform:translate(-50%,-50%) rotate(45deg);border-radius:6px}
.s-page{width:14px;height:14px;border-radius:50%;border-style:dashed !important}
.peb b{font-family:var(--font-mono);font-size:9px;color:var(--ink);position:relative;z-index:1}
.s-cache b{transform:rotate(-45deg)}
.nd .nm{display:block;transform:translate(-50%,0);position:absolute;left:0;top:16px;white-space:nowrap;font-size:11.5px;color:var(--body);background:var(--float);border:1px solid var(--hair);border-radius:7px;padding:2px 8px}
.nd.big .peb{width:34px;height:34px;box-shadow:0 0 0 3px var(--accent-dim)}
.nd.big .peb b{font-size:11px}
.nd.big .nm{font-size:12px;color:var(--ink);font-weight:700;top:20px}
.tick{position:absolute;left:50%;top:-7px;transform:translateX(-50%);width:14px;height:3px;border-radius:2px}
.nd.dim{opacity:.25}
.nd.lit .peb{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-line)}
.nd.lit .nm{color:var(--ink);border-color:var(--accent-line)}
.cf{display:block;position:absolute;left:0;top:38px;transform:translateX(-50%);font-family:var(--font-mono);font-size:10px;color:var(--accent);display:none}
.nd.lit .cf{display:block}
.e-b{fill:none;stroke:var(--edge);stroke-width:1.1}
.e-o{fill:none;stroke:var(--edge);stroke-width:1;stroke-dasharray:2 5;opacity:.7}
.e-s{fill:none;stroke:var(--accent);stroke-width:1;stroke-dasharray:1 4;opacity:.6}
.e-r{fill:none;stroke:var(--accent);stroke-width:1.4;opacity:0;transition:opacity .4s}
.e-r.on{opacity:.85}
.ring{fill:none;stroke:var(--accent);stroke-dasharray:3 8;opacity:0;transition:opacity .5s}
.ring.on{opacity:.7}
.qnode{position:absolute;display:none;z-index:6}
.qnode.on{display:block}
.qc{transform:translate(-50%,-50%);background:var(--ink);color:var(--canvas);border-radius:99px;padding:9px 16px;font-size:13px;max-width:360px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.panel{position:fixed;top:70px;right:16px;z-index:25;width:232px;background:var(--float);border:1px solid var(--hair);border-radius:14px;padding:12px 14px}
.panel h3{font-size:13px;color:var(--ink);display:flex;justify-content:space-between}
.panel h3 span{font-family:var(--font-mono);font-size:10px;color:var(--ph);font-weight:400}
.cap{font-size:10px;color:var(--ph);letter-spacing:.08em;margin:9px 0 2px}
.row{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;padding:4px 0}
.row input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px}
.row input[type=range]{flex:1;accent-color:var(--accent)}
.seg{display:flex;border:1px solid var(--hair);border-radius:8px;overflow:hidden}
.seg button{font-size:11.5px;color:var(--sec);padding:3px 9px}
.seg button.on{background:var(--accent-dim);color:var(--ink)}
.thv{font-family:var(--font-mono);font-size:10.5px;color:var(--accent)}
.legend{position:fixed;left:16px;bottom:52px;z-index:25;background:var(--float);border:1px solid var(--hair);border-radius:12px;padding:9px 13px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.li{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--sec)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.info{width:22px;height:22px;border-radius:50%;border:1px solid var(--hair2);color:var(--sec);font-size:11px;font-weight:700}
.zoom{position:fixed;right:16px;bottom:52px;z-index:25;display:flex;flex-direction:column;gap:7px;align-items:flex-end}
.zoom button{width:34px;height:34px;border-radius:10px;background:var(--float);border:1px solid var(--hair);color:var(--sec);font-size:15px}
.zlab{font-family:var(--font-mono);font-size:10.5px;color:var(--ph)}
.status{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:25;font-family:var(--font-mono);font-size:11px;color:var(--sec);background:var(--float);border:1px solid var(--hair);border-radius:99px;padding:4px 16px;white-space:nowrap}
.status b{color:var(--ink)}
.ins{position:fixed;top:56px;right:0;bottom:0;width:372px;max-width:94vw;z-index:28;background:var(--float);border-left:1px solid var(--hair);transform:translateX(105%);transition:transform .38s var(--ease);display:flex;flex-direction:column}
.ins.on{transform:none}
.ins-h{padding:16px 18px 12px;border-bottom:1px solid var(--hair)}
.ins-lib{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--sec);margin-bottom:7px}
.ins-t{font-size:16px;font-weight:700;color:var(--ink)}
.ins-p{font-family:var(--font-mono);font-size:10.5px;color:var(--ph);margin-top:3px;word-break:break-all}
.ins-m{font-family:var(--font-mono);font-size:10.5px;color:var(--sec);margin-top:8px;display:flex;gap:12px}
.ins-b{flex:1;overflow:auto;padding:14px 18px}
.sec{margin-bottom:16px}.sec h5{font-size:11px;color:var(--ph);margin-bottom:7px;font-weight:500;letter-spacing:.06em}
.snip{font-size:13px;line-height:1.8;background:var(--core2);border:1px solid var(--hair);border-radius:10px;padding:10px 12px}
.snip mark{background:var(--accent-dim);color:var(--ink);border-radius:3px;padding:0 3px}
.rel{display:flex;gap:8px;width:100%;text-align:left;padding:7px 10px;border-radius:8px;font-size:12.5px;color:var(--body);background:transparent;border:1px solid transparent}
.rel:hover{background:var(--core2);color:var(--ink)}
.rel .s{font-family:var(--font-mono);font-size:10.5px;color:var(--accent);margin-left:auto}
.chip{font-family:var(--font-mono);font-size:10.5px;padding:2px 9px;border-radius:6px}
.chip.ok{background:var(--accent-dim);color:var(--accent)}.chip.wait{background:rgba(252,211,77,.13);color:var(--c-meet)}.chip.bad{background:rgba(248,113,113,.13);color:var(--fail)}
.ins-f{padding:12px 18px;border-top:1px solid var(--hair);display:flex;gap:8px}
.btn2{font-size:12.5px;border:1px solid var(--hair);border-radius:9px;padding:6px 14px;color:var(--sec)}
.btnP{background:var(--accent);color:#042622;border:none;border-radius:9px;font-size:12.5px;font-weight:700;padding:6px 16px}
[data-theme="light"] .btnP{color:#fff}
.tip{position:fixed;z-index:40;pointer-events:none;opacity:0;transition:opacity .15s;background:var(--float);border:1px solid var(--hair2);border-radius:10px;padding:8px 12px;max-width:320px;transform:translate(-50%,calc(-100% - 14px))}
.tip.show{opacity:1}.tip .p{font-family:var(--font-mono);font-size:10.5px;color:var(--ink);word-break:break-all}.tip .m{font-size:10.5px;color:var(--ph);margin-top:3px}
.mech{position:fixed;left:16px;bottom:112px;z-index:26;width:330px;background:var(--float);border:1px solid var(--hair);border-radius:13px;padding:13px 15px;display:none}
.mech.on{display:block}.mech h4{font-size:12.5px;color:var(--ink);margin-bottom:7px}.mech p{font-size:11.5px;color:var(--sec);line-height:1.7;margin-bottom:5px}.mech b{color:var(--body)}
.stage.min .nm{display:none}.stage.min .nd.big .nm,.stage.min .nd.lit .nm{display:block}
.depth{position:fixed;left:16px;top:70px;z-index:24;font-family:var(--font-mono);font-size:10px;color:var(--ph);line-height:1.9;border:1px solid var(--hair);border-radius:11px;padding:8px 12px;background:var(--float)}
.depth b{color:var(--sec)}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</head>

<header class="top">
  <span class="brand"><i></i>Obsidian RAG · 图谱</span><span class="tag">B · 深渊群岛 demo · 15 假节点</span>
  <nav class="scope" id="scope"><button data-s="" class="on">全部库</button><button data-s="技术笔记">技术笔记</button><button data-s="论文阅读">论文阅读</button><button data-s="会议记录">会议记录</button></nav>
  <span class="spacer"></span><button class="theme-btn" id="themeBtn">切换浅色</button>
</header>
<div class="depth"><b>DEPTH −1200m</b><br>海沟 = 库分界 · 无填充<br>岛内径向簇 · 桥 = 索道</div>
<div class="dock"><div class="island"><span style="color:var(--sec)">⌕</span><input id="q" placeholder="向全库提问，索道从问题浮标荡开"><select id="topk"><option>3</option><option selected>5</option></select><button class="btn" id="go">检索</button></div></div>
<div class="stage" id="stage"><div class="world" id="world"><svg class="lyr" id="sea" width="2400" height="1400"></svg><div class="nodes" id="nodes"></div><div class="qnode" id="qnode"><div class="qc"><span id="qq"></span> <button id="qx" style="border:1px solid currentColor;border-radius:50%;width:18px;height:18px;font-size:11px;opacity:.6">✕</button></div></div></div></div>
<aside class="panel"><h3>图层 <span id="sum"></span></h3>
<div class="cap">边</div>
<label class="row"><span>显式双链</span><input type="checkbox" id="lB" checked></label>
<label class="row"><span>语义相似边</span><input type="checkbox" id="lS"></label>
<div class="row"><input type="range" id="th" min="0.5" max="0.85" step="0.01" value="0.62"><span class="thv" id="thv">0.62</span></div>

<div class="row"><span>着色</span><span class="seg" id="seg"><button data-m="lib" class="on">按库</button><button data-m="state">按生效</button><button data-m="mono">单色</button></span></div>
<label class="row"><span>岛台边界</span><input type="checkbox" id="lBd" checked></label>
</aside>
<div class="legend" id="legend"></div>
<div class="mech" id="mech"><h4>深渊力学</h4><p><b>固定岛位：</b>每库一座玄武岩岛台，岛间距 = 深渊海沟（负空间），永不重叠。</p><p><b>岛内径向：</b>hub 居岛心，余下环绕；页/缓存卫星环绕其 PDF。</p><p><b>治杂草：</b>默认只画岛内双链；跨岛桥画成「索道」高亮，语义边默认关闭。</p></div>
<div class="zoom"><button id="zin">＋</button><button id="zout">－</button><button id="zfit">⤢</button><span class="zlab" id="zlab">100%</span></div>
<div class="status" id="status"></div>
<aside class="ins" id="ins"><div class="ins-h"><div class="ins-lib"><span id="iDot" class="dot"></span><span id="iLib"></span><span id="iBadge"></span><span style="flex:1"></span><button class="theme-btn" id="iX">关闭</button></div><div class="ins-t" id="iT"></div><div class="ins-p" id="iP"></div><div class="ins-m" id="iM"></div></div><div class="ins-b" id="iB"></div><div class="ins-f"><button class="btn2" id="iOpen">打开源文件</button><button class="btnP" id="iRel">以此为中心</button></div></aside>
<div class="tip" id="tip"><div class="p" id="tp"></div><div class="m" id="tm"></div></div>

var state={scope:"",color:"lib",ly:{b:1,s:0,o:1,p:0,c:1,pdf:1,bd:1},k:1,tx:30,ty:60,q:null,hits:null};
function $(id){return document.getElementById(id);}
var NS="http://www.w3.org/2000/svg",sea=$("sea"),nodesEl=$("nodes"),stage=$("stage"),world=$("world");
function el(n,a,p){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);(p||sea).appendChild(e);return e;}
var eB=[],eO=[],eS=[],eR=[],rings=[],islEls=[];
function build(){
  /* 海沟中线 */
  el("line",{x1:700,y1:120,x2:700,y2:660,"class":"trench"});
  el("line",{x1:1340,y1:120,x2:1340,y2:660,"class":"trench"});
  var t=el("text",{x:688,y:140,fill:"var(--ph)","font-size":"10","font-family":"Cascadia Code,Consolas,monospace"});t.textContent="TRENCH";
  var t2=el("text",{x:1328,y:140,fill:"var(--ph)","font-size":"10","font-family":"Cascadia Code,Consolas,monospace"});t2.textContent="TRENCH";
  ISL.forEach(function(s){
    var g=document.createElement("div");g.className="isl";g.style.left=s.x+"px";g.style.top=s.y+"px";g.style.width=s.w+"px";g.style.height=s.h+"px";g.dataset.lib=s.lib;nodesEl.appendChild(g);islEls.push(g);
    var h=document.createElement("div");h.className="isl-h";h.innerHTML="<i style='background:"+s.c+"'></i><b>"+s.lib+"</b><span>"+NODES.filter(function(n){return n.lib===s.lib;}).length+" 节点</span>";g.appendChild(h);
  });
  [80,150,220].forEach(function(r){rings.push(el("circle",{cx:1020,cy:700,r:r,"class":"ring"}));});
  BILAT.forEach(function(e){var p=el("path",{"class":"e-b"});p.dataset.a=e[0];p.dataset.b=e[1];if(e[2]){p.style.stroke="var(--accent)";p.style.strokeWidth="1.8";}eB.push(p);});
  OWN.forEach(function(e){var p=el("path",{"class":"e-o"});p.dataset.a=e[0];p.dataset.b=e[1];eO.push(p);});
  SEM.forEach(function(e){var p=el("path",{"class":"e-s"});p.dataset.a=e[0];p.dataset.b=e[1];p.dataset.sim=e[2];eS.push(p);});
  NODES.forEach(function(n){
    var d=document.createElement("div");d.className="nd"+(n.big?" big":"");d.dataset.id=n.id;d.style.left=n.x+"px";d.style.top=n.y+"px";
    var cls=n.type==="md"?"s-md":n.type==="pdf"?"s-pdf":n.type==="cache"?"s-cache":"s-page";
    d.innerHTML='<span class="peb '+cls+'"><span class="tick"></span><b>'+n.glyph+'</b></span><span class="nm">'+n.name+'</span><span class="cf"></span>';
    nodesEl.appendChild(d);n._el=d;
    d.addEventListener("click",function(e){e.stopPropagation();openIns(n.id);});
    d.addEventListener("mousemove",function(e){$("tp").textContent=n.lib+" · "+n.rel;$("tm").textContent=n.chunks+" 块 · "+n.type+" · "+n.pipe.join(" / ");var t=$("tip");t.style.left=e.clientX+"px";t.style.top=e.clientY+"px";t.classList.add("show");});
    d.addEventListener("mouseleave",function(){$("tip").classList.remove("show");});
  });
  paint();
}
function vis(n){if(state.scope&&n.lib!==state.scope)return false;if(n.type==="page")return!!state.ly.p;if(n.type==="cache")return!!state.ly.c;if(n.type==="pdf")return!!state.ly.pdf;return true;}
function col(n){if(state.color==="mono")return"var(--sec)";if(state.color==="state")return n.state==="ok"?"var(--ok)":n.state==="partial"?"var(--part)":n.state==="failed"?"var(--fail)":"var(--sec)";return LIBC[n.lib];}
function D(a,b){return "M"+a.x+","+a.y+" L"+b.x+","+b.y;}
function paint(){
  NODES.forEach(function(n){
    var show=vis(n);n._el.style.display=show?"":"none";
    n._el.classList.toggle("dim",!!(state.hits&&state.hits.indexOf(n.id)<0));
    n._el.classList.toggle("lit",!!(state.hits&&state.hits.indexOf(n.id)>=0));
    var c=col(n);n._el.querySelector(".tick").style.background=c;
    var peb=n._el.querySelector(".peb");
    if(n.type==="pdf"){peb.style.background=c;}else{peb.style.borderColor=(state.color==="mono")?"var(--hair2)":c;}
    if(n.state==="failed")peb.style.borderColor="var(--fail)";
  });
  eB.forEach(function(p){var a=byId[p.dataset.a],b=byId[p.dataset.b],ok=state.ly.b&&vis(a)&&vis(b);p.style.display=ok?"":"none";if(ok)p.setAttribute("d",D(a,b));});
  eO.forEach(function(p){var a=byId[p.dataset.a],b=byId[p.dataset.b],ok=state.ly.o&&vis(a)&&vis(b);p.style.display=ok?"":"none";if(ok)p.setAttribute("d",D(a,b));});
  eS.forEach(function(p){var a=byId[p.dataset.a],b=byId[p.dataset.b],ok=state.ly.s&&(+p.dataset.sim>=+$("th").value)&&vis(a)&&vis(b);p.style.display=ok?"":"none";if(ok)p.setAttribute("d",D(a,b));});
  eR.forEach(function(p){p.remove();});eR=[];
  if(state.q){state.hits.forEach(function(id){var p=el("path",{"class":"e-r on"});p.setAttribute("d","M1020,700 L"+byId[id].x+","+byId[id].y);eR.push(p);});}
  rings.forEach(function(r){r.classList.toggle("on",!!state.q);});
  islEls.forEach(function(g){g.style.display=(!state.ly.bd||(state.scope&&g.dataset.lib!==state.scope))?"none":"";});
  stage.classList.toggle("min",state.k<0.85);
  var v=NODES.filter(vis).length;$("sum").textContent=v+" 节点";
  var L='<span class="li"><span class="dot" style="border-radius:3px"></span>md</span><span class="li"><span class="dot" style="clip-path:polygon(0 0,60% 0,100% 40%,100% 100%,0 100%);border-radius:0"></span>PDF</span><span class="li"><span class="dot" style="transform:rotate(45deg);border-radius:2px;width:9px;height:9px"></span>缓存</span><span class="li"><span class="dot" style="width:7px;height:7px"></span>页</span>';
  if(state.color==="lib")L+=Object.keys(LIBC).map(function(k){return '<span class="li"><span class="dot" style="background:'+LIBC[k]+'"></span>'+k+'</span>';}).join("");
  if(state.color==="state")L+='<span class="li"><span class="dot" style="background:var(--ok)"></span>生效</span><span class="li"><span class="dot" style="background:var(--part)"></span>缺 WEMM</span><span class="li"><span class="dot" style="background:var(--fail)"></span>失败</span>';
  L+='<button class="info" id="infoBtn">i</button>';$("legend").innerHTML=L;$("infoBtn").onclick=function(e){e.stopPropagation();$("mech").classList.toggle("on");};
  applyCam();
  $("status").innerHTML=state.q?('检索态 · <b>'+state.q+'</b> · 索道 <b>'+state.hits.length+'</b> · 其余下沉'):('常态巡航 · <b>'+v+'</b> 节点 · 海沟分隔 · 索道高亮跨岛桥');
}
function applyCam(){world.style.transform="translate("+state.tx+"px,"+state.ty+"px) scale("+state.k+")";$("zlab").textContent=Math.round(state.k*100)+"%";}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");}
function doSearch(q){q=q||$("q").value.trim();if(!q)return;var key=/重排|混合/.test(q)?"重排":/wemm|页/i.test(q)?"wemm":/扫描|pdf/i.test(q)?"扫描":"默认";state.q=q;state.hits=HITS[key];$("qq").textContent="⌖ "+q;$("qnode").classList.add("on");$("qnode").style.left="1020px";$("qnode").style.top="700px";var cf=[.87,.74,.61];state.hits.forEach(function(id,i){byId[id]._el.querySelector(".cf").textContent="◈ "+cf[i%3].toFixed(2);});var r=stage.getBoundingClientRect();state.k=Math.max(state.k,1);state.tx=r.width/2-1020*state.k;state.ty=r.height/2-640*state.k;paint();}
function clearS(){state.q=null;state.hits=null;$("qnode").classList.remove("on");paint();}
var OUTL={t1:["t2","t3"],p3:["p4"],m1:["m2"],m2:["m1","m3"]},INL={p3:["t1","p2"],m2:["m1","t2"]};
function openIns(id){var n=byId[id];$("iDot").style.background=LIBC[n.lib];$("iLib").textContent=n.lib;$("iBadge").innerHTML=n.state==="ok"?'<span class="chip ok">全链路生效</span>':n.state==="failed"?'<span class="chip bad">提取失败</span>':'<span class="chip wait">部分生效</span>';$("iT").textContent=n.name;$("iP").textContent=n.lib+" · "+n.rel;$("iM").innerHTML="<span>"+n.chunks+" 块</span><span>"+n.type.toUpperCase()+"</span><span>双链 "+((OUTL[id]||[]).length+(INL[id]||[]).length)+"</span>";
var h='<div class="sec"><h5>管线</h5><div style="display:flex;gap:6px">'+n.pipe.map(function(p){return '<span class="chip '+(/done|生效/.test(p)?"ok":/fail/.test(p)?"bad":"wait")+'">'+esc(p)+'</span>';}).join("")+'</div></div>';
h+='<div class="sec"><h5>双链</h5>'+(((OUTL[id]||[]).length||(INL[id]||[]).length)?(OUTL[id]||[]).map(function(o){return '<button class="rel" data-g="'+o+'">→ '+byId[o].name+'<span class="s">出链</span></button>';}).join("")+(INL[id]||[]).map(function(o){return '<button class="rel" data-g="'+o+'">← '+byId[o].name+'<span class="s">入链</span></button>';}).join(""):'<div style="font-size:12px;color:var(--ph)">暂无双链</div>')+'</div>';
h+='<div class="sec"><h5>语义近邻</h5>'+(SEM.filter(function(e){return e[0]===id||e[1]===id;}).map(function(e){var o=e[0]===id?e[1]:e[0];return '<button class="rel" data-g="'+o+'">'+byId[o].name+'<span class="s">'+e[2].toFixed(2)+'</span></button>';}).join("")||'<div style="font-size:12px;color:var(--ph)">开启语义边后可见</div>')+'</div>';
h+='<div class="sec"><h5>命中片段</h5><div class="snip">…<mark>'+esc(n.name)+'</mark>：深渊方案把跨库距离拉开到海沟宽度，岛内只留强边，弱边默认沉底。…</div></div>';
$("iB").innerHTML=h;Array.prototype.forEach.call($("iB").querySelectorAll("[data-g]"),function(b){b.onclick=function(){openIns(b.dataset.g);};});$("ins").classList.add("on");}
$("go").onclick=function(){doSearch();};$("q").addEventListener("keydown",function(e){if(e.key==="Enter")doSearch();});
$("qx").onclick=function(e){e.stopPropagation();$("q").value="";clearS();};
$("th").oninput=function(){$("thv").textContent=(+$("th").value).toFixed(2);paint();};
[["lB","b"],["lS","s"],["lO","o"],["lP","p"],["lC","c"],["lPdf","pdf"],["lBd","bd"]].forEach(function(p){$(p[0]).onchange=function(){state.ly[p[1]]=$(p[0]).checked?1:0;paint();};});
Array.prototype.forEach.call(document.querySelectorAll("#seg button"),function(b){b.onclick=function(){state.color=b.dataset.m;Array.prototype.forEach.call(document.querySelectorAll("#seg button"),function(x){x.classList.toggle("on",x===b);});paint();};});
Array.prototype.forEach.call(document.querySelectorAll("#scope button"),function(b){b.onclick=function(){state.scope=b.dataset.s;Array.prototype.forEach.call(document.querySelectorAll("#scope button"),function(x){x.classList.toggle("on",x===b);});paint();};});
$("themeBtn").onclick=function(){var h=document.documentElement;h.dataset.theme=h.dataset.theme==="dark"?"light":"dark";$("themeBtn").textContent=h.dataset.theme==="dark"?"切换浅色":"切换深色";};
$("iX").onclick=function(){$("ins").classList.remove("on");clearS();};
$("iOpen").onclick=function(){alert("demo：打开源文件");};$("iRel").onclick=function(){alert("demo：以该节点为岛心");};
$("zin").onclick=function(){state.k=Math.min(1.8,state.k*1.15);paint();};$("zout").onclick=function(){state.k=Math.max(.5,state.k/1.15);paint();};$("zfit").onclick=function(){state.k=1;state.tx=30;state.ty=60;paint();};
stage.addEventListener("click",function(e){if(e.target===stage){$("ins").classList.remove("on");$("mech").classList.remove("on");}});
(function(){var pan=null;stage.addEventListener("pointerdown",function(e){if(e.target.closest&&(e.target.closest(".nd")||e.target.closest("button")||e.target.closest("input")||e.target.closest("select")))return;pan={x:e.clientX,y:e.clientY,tx:state.tx,ty:state.ty};try{stage.setPointerCapture(e.pointerId);}catch(_){}});
stage.addEventListener("pointermove",function(e){if(!pan)return;state.tx=pan.tx+(e.clientX-pan.x);state.ty=pan.ty+(e.clientY-pan.y);applyCam();});stage.addEventListener("pointerup",function(){pan=null;});})();
build();
</script>
</body>
</html>
